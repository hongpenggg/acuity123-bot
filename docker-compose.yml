# Local Postgres for running the live database tests (tests/test_db_live.py).
#   docker compose up -d db
#   TEST_DATABASE_URL=postgresql://postgres:postgres@localhost:5433/studybot_test \
#     python -m pytest tests/test_db_live.py -v
#
# Production runs on the Contabo VPS under systemd with Supabase as the database
# (see README) — this file exists so nobody has to point tests at real user data.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: studybot_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 20
